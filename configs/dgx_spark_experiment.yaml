  provisional_hyperparameter_ranges:
    alpha: [0.000001, 1000000.0]
  exact_hyperparameters:
    decode_only_alpha: 10.0
    mixed_alpha: 10.0
    prefill_only_alpha: 0.000001
  mixed_model_structure:
    dispatch_feature: x_4_decode_count
    segments:
      - {name: decode_1_4, minimum_inclusive: 1, maximum_inclusive: 4}
      - {name: decode_5_16, minimum_inclusive: 5, maximum_inclusive: 16}
      - {name: decode_17_64, minimum_inclusive: 17, maximum_inclusive: 64}
    residual_calibration_scope: one_shared_mixed_window
  random_seed: null
  online_model_weight_updates: forbidden
  residual_definition: actual_duration_seconds_minus_base_duration_seconds
  duration_timing_boundary: >-
    vllm_official_after_execute_model_submission_through_model_result_and_sampling
  expected_duration_calibration: per_batch_kind_online_window_mean
  conservative_duration_calibration: online_window_centered_p95_higher
  residual_groups:
    - prefill_only
    - decode_only
    - mixed
  residual_token_buckets: disabled
  residual_window_candidates: [32, 64, 128]
  residual_window_minimum_samples: 32
  residual_window_selection: training_oof_only
