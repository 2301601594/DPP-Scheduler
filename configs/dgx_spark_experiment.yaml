generation:
  completion: natural_eos
  predetermined_output_length: false
  scheduler_output_length_state: forbidden
  client_safety_ceiling_tokens: 2048
  client_safety_ceiling_role: termination_guard_only_never_scheduler_input
  sampling_parameters:
    temperature: 0.0
    top_p: 1.0
    ignore_eos: false
    seed_source: per_request_trace
  finish_reason_validation: >-
    Record and stratify every terminal reason. Both stop and length are valid
    observations; a length terminal means the client safety guard fired and
    must never reveal a target or remaining length to the Scheduler.

trace_source:
  dataset: /home/dongj/LLM/data/raw/ShareGPT_V3_unfiltered_cleaned_split.json
  dataset_sha256: 35f0e213ce091ed9b9af2a1f0755e9d39f9ccec34ab281cd4ca60d70f6479ba4
