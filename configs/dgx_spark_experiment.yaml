slo:
  classes: 1
  source: stock_natural_eos_validation
  freeze_before_dpp_results: true
  ttft_seconds: 2.0
  tbt_seconds: 0.25
  request_success_definition: >-
    A request is completed successfully when HTTP 200, finish_reason is present,
    actual streamed token count matches usage, and no client error occurred.
    Both finish_reason=stop and finish_reason=length are retained and stratified
    separately; length is a client-guard termination, never a Scheduler input.
  actual_goodput_definition: >-
    Request-level Goodput is counted only after a terminal request event. For
    the natural-EOS Goodput metric, finish_reason=stop counts as success;
    finish_reason=length is reported separately and is not silently discarded.

contracts:
  immutable_per_decision: true
  require_snapshot_hash_match: true
  snapshot_hash_placement: every_public_decision_round_contract
  types:
