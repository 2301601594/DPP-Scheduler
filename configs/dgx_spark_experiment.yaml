safe_set:
  parameter_status: provisional_for_scheduler_integration
  formal_benchmark_eligible: false
  provisional_basis: >-
    Design-derived integration values, not a measured G4 freeze. With a
    16-token KV block, at most one Decode token per request per iteration,
    max_num_seqs=64, and 30149 usable blocks, H=8 covers half a block period;
    R0=64 reserves one additional block per maximum active sequence. The
    legacy Top-K=3 field is retained for schema compatibility but inactive:
    SLO risk is metadata and every hard-feasible candidate reaches DPP.
  hard_filters:
    - total_token_budget
    - sequence_budget
    - current_projected_kv
    - rolling_kv
    - predictor_support
  rolling_kv_horizon_iterations: 8
  reserve_blocks_r0: 64
  full_output_length_reservation: forbidden
  slo_risk_is_hard_filter: false
  all_risk_order:
    - predicted_violation_count
    - predicted_total_lateness
    - stable_plan_key
  top_k_when_all_risky: 3

fallback:
  parameter_status: provisional_for_scheduler_integration
  formal_benchmark_eligible: false
  participates_in_dpp_scoring: false
  with_decode: edf_decode_only_no_prefill
  without_decode: minimum_physically_feasible_prefill
  minimum_prefill_chunk_tokens: 6
  final_path: native_preemption_or_empty_workload_idle
  must_pass_hard_filters: true

dpp:
  parameter_status: frozen_for_scheduler_integration
  formal_benchmark_eligible: false
  freeze_manifest_path: configs/dpp_selector_integration_freeze.json
  freeze_manifest_sha256: d8baf6f6824792c7e59a5b73ec4f0b67a9e0883957654b90f8df7d741a5c1f84
  freeze_basis: >-
    epsilon=0.05 is the conservative round-up of retained Stock miss ratios at
    0.20 and 0.25 req/s; weight_v=0.0 disables the obligation-level utility
    during this bug-fix integration while retaining the normalized backlog and
    debt terms. These integration values are not a tuned formal benchmark
    optimum.
  control_state:
    - prefill_backlog
    - ttft_debt
    - tbt_debt
  epsilon_ttft: 0.05
  epsilon_tbt: 0.05
  weight_v: 0.0
  denominator: expected_duration
  service_utility: ttft_success_plus_tbt_success
  normalization:
    prefill_backlog_tokens: 2048
    prefill_service_tokens: 2048
    ttft_debt_obligations: 64
    tbt_debt_obligations: 64
    obligation_outcomes: 64
    service_utility_obligations: 64
  score_numeric_ranges:
    nonnegative_minimum: 0.0
    finite_absolute_maximum: 1.7976931348623157e+308
  zero_duration_behavior: reject_candidate
  tie_break:
    - fewer_predicted_misses
    - larger_conservative_deadline_margin
    - smaller_plan_id
  updates_from_actual_observation_only: true
  obligation_settlement_exactly_once: true

