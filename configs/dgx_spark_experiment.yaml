    - BatchPlan
    - Prediction
    - ControlState
  fallback_owner: controller
  dpp_candidate_set_name: safe_candidates
  ttft_completion_event: client_receives_first_sse_token_chunk_after_dispatch
  tbt_completion_event: client_receives_consecutive_single_token_sse_chunks
  scheduler_obligation_settlement_event: >-
    engine_core_output_created_by_locked_scheduler_update_from_output

