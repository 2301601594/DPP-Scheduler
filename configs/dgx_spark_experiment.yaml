  enable_thinking: false
  min_input_tokens: 128
  max_input_tokens: 8192
  pool_size: 3000
  pool_seed: 1001

slo:
  classes: 1
  source: stock_natural_eos_validation
  freeze_before_dpp_results: true
  ttft_seconds: 2.0
  tbt_seconds: 0.25
  request_success_definition: >-
    A request is completed successfully when HTTP 200, finish_reason is present,
    actual streamed token count matches usage, and no client error occurred.
    Both finish_reason=stop and finish_reason=length are retained and stratified
    separately; length is a client-guard termination, never a Scheduler input.
  actual_goodput_definition: >-
    Request-level Goodput is counted only after a terminal request event. For
    the natural-EOS Goodput metric, finish_reason=stop counts as success;
    finish_reason=length is reported separately and is not silently discarded.

contracts:
  immutable_per_decision: true
  require_snapshot_hash_match: true
  snapshot_hash_placement: every_public_decision_round_contract
  types:
    - StateSnapshot
    - BatchPlan
    - Prediction
    - ControlState
  fallback_owner: controller
  dpp_candidate_set_name: safe_candidates
  ttft_completion_event: client_receives_first_sse_token_chunk_after_dispatch
  tbt_completion_event: client_receives_consecutive_single_token_sse_chunks
  scheduler_obligation_settlement_event: >-
    engine_core_output_created_by_locked_scheduler_update_from_output

candidate_generator:
  algorithm: slack_centered_multiplier_v3
  prefill_budget_multipliers: [0.50, 0.75, 1.00, 1.25, 1.50]
  prefill_multiplier_rounding: floor
  maximum_seed_candidates: 16
  minimum_prefill_chunk_tokens: 6
  all_active_decode_required: true
  predictor_inversion_safety_margin_seconds: 0.020
  predictor_inversion_budget_grid:
    - 0
    - 64
    - 128
    - 256
    - 384
    - 512
    - 768
    - 1024
    - 1536
    - 2048
  prefill_priority_policies: [URGENCY, COMPLETION_AWARE, CONTINUATION]
  completion_aware_tiering: relative_urgency_tertiles
  completion_aware_equal_score_policy: same_tier_at_first_rank
  completion_aware_order:
    - relative_urgency_tier
    - remaining_tokens
    - running_before_waiting
    - arrival_time
    - ordinal
    - request_id
  zero_candidate_always_emitted: true
  recovery_age_threshold_seconds: 0.25
  recovery_age_threshold_status: provisional_for_scheduler_integration
  recovery_age_threshold_source: >-
    slo.tbt_seconds=0.25; selected as the smallest conservative existing
    same-scale value for one full TBT-SLO interval after the first miss.
  parameters_frozen: true
  formal_benchmark_eligible: false
  canonical_deduplication: true
  decode_order: [arrival_time, ordinal, request_id]
  prefill_order_tiers: [top_urgency_third, middle_urgency_third, bottom_urgency_third]
  stable_prefill_tie_key: [arrival_time, ordinal, request_id]
  kv_projection_side_effect_free: true

