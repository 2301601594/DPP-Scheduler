    development_default_acknowledged: true
    development_default_basis: >-
      User-directed uncalibrated default for immediate non-formal engineering
      comparison. Kappa_ood is fixed to zero; this is not calibration evidence
      and cannot enable a formal benchmark or scientific effectiveness claim.
    development_nonformal_only: true
    live_v2_eligible: true

safe_set:
  parameter_status: provisional_for_scheduler_integration
  formal_benchmark_eligible: false
  provisional_basis: >-
    Design-derived integration values, not a measured G4 freeze. With a
    16-token KV block, at most one Decode token per request per iteration,
    max_num_seqs=64, and 30149 usable blocks, H=8 covers half a block period;
    R0=64 reserves one additional block per maximum active sequence. The
    legacy Top-K=3 field is retained for schema compatibility but inactive:
    SLO risk is metadata and every hard-feasible candidate reaches DPP.
  hard_filters:
    - total_token_budget
    - sequence_budget
    - current_projected_kv
    - rolling_kv
    - prediction_numerical_validity
  rolling_kv_horizon_iterations: 8
  reserve_blocks_r0: 64
  full_output_length_reservation: forbidden
  slo_risk_is_hard_filter: false
  top_k_when_all_risky: 3
  top_k_when_all_risky_status: legacy_inactive

fallback:
  parameter_status: provisional_for_scheduler_integration
  formal_benchmark_eligible: false
  participates_in_dpp_scoring: false
  with_decode: edf_decode_only_no_prefill
  without_decode: minimum_physically_feasible_prefill
  minimum_prefill_chunk_tokens: 6
  final_path: native_preemption_or_empty_workload_idle
  must_pass_hard_filters: true

dpp:
  algorithm: request_service_deficit_v2
  parameter_status: frozen_for_development_nonformal_validation
  formal_benchmark_eligible: false
  reference_concurrency:
    statistic: p50_positive_frames
    prefill: 1
    decode: 36
    parameter_status: frozen_from_development_stock_n300_positive_frame_p50
    artifact_path: >-
      artifacts/qwen3_14b_dgx_spark/dpp_v2/reference_concurrency_dev_n300.json
    artifact_sha256: 6d2ac889f687166d9cd8a2d072a4dce62205eee380cf071ca13ec1e4534ab2ea
    development_freeze_basis: >-
      Measured positive-frame P50 from one normal Stock n=300 run at QPS=0.25
      and seed=1003. This development freeze is not formal-benchmark eligible.
  control_state: [ttft_service_debts_by_request, tbt_service_debts_by_request]
  use_variable_frame_rate: true
  effective_duration:
    interpolation: expected_duration
    constrained_extrapolation: conservative_duration
  score: negative_fixed_reference_lyapunov_drift_per_effective_second
  score_tie_tolerance:
    relative: 1.0e-9
    absolute: 1.0e-12
  score_numeric_ranges:
    nonnegative_minimum: 0.0
    finite_absolute_maximum: 1.7976931348623157e+308
  tie_break:
    - smaller_effective_duration
    - smaller_prefill_budget
    - smaller_plan_id
  updates_from_actual_observation_only: true
  per_request_actual_prefill_feedback_required: true
  per_request_actual_decode_feedback_required: true
  first_token_initializes_tbt_debt_without_tbt_service: true
  ttft_prefill_debt_removed_at_prompt_completion: true
  legacy_compatibility_inactive:
    epsilon_ttft: 0.05
    epsilon_tbt: 0.05
    weight_v: 0.0
    token_normalization: 2048
    obligation_normalization: 64

